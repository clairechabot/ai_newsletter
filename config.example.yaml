# config.example.yaml — copy to config.yaml and edit.
# Only `briefing`, `filter`, and `sources` are required. Everything below
# `sources` is optional and defaults to "off", so a minimal config still ships
# a plain themed email.
briefing:
  title: "My Daily Briefing"

filter:
  mode: interests          # interests | recent | per_source_cap | claude_curate
  interests:
    - "AI policy in Europe"
    - "longevity research"
  max_items: 25
  per_source_cap: 5
  recency_hours: 24

sources:
  - { type: rss,  name: "BBC World", url: "http://feeds.bbci.co.uk/news/world/rss.xml" }
  - { type: site, name: "Seedcamp", module: "seedcamp" }
  # - { type: rss,  name: "Atlas Obscura", url: "https://atlasobscura.com/feeds/latest", proxy: true }  # proxy: true routes bot-blocked feeds through a relay
  # - { type: rss,  name: "Slow Feed", url: "https://example.com/rss", timeout: 60 }  # seconds; default 30
  # - { type: scrape, name: "Static Site", url: "https://example.com/news",
  #     item_selector: ".post", title_selector: "h2 a", link_selector: "h2 a" }
  # - { type: claude_fetch, name: "No-Feed Site", url: "https://example.com" }
  # - { type: youtube, name: "Veritasium", channel_id: "UCxxxx" }   # add skip_shorts: true to drop Shorts

# ── Optional extensions ───────────────────────────────────────────────────────

# email.mode: "full" (default) sends the whole briefing in the email.
# "cover" sends a short cover (greeting + top item + table of contents) that
# links out to the web edition — pair it with `web.enabled: true` below.
# email.subject: "date" (default) -> "My Daily Briefing - Sep 24, 2026".
# "top_pick" -> "My Daily Briefing | <lead headline>", which gets more opens.
# email.from_name: the sender name the inbox shows (e.g. "The Edge"); blank
# shows the sending account's own name.
# email:
#   mode: cover
#   subject: top_pick
#   from_name: "The Edge"

# voice: give your briefing an AI editor persona — entirely yours to invent.
# When enabled it writes a short daily greeting and names the themes in that
# voice. `name` signs the greeting; `tone` is the prompt that steers the style
# (a few descriptive adjectives work best — see the README "editor voice"
# section for how to craft it and more examples). Needs ANTHROPIC_API_KEY;
# fails soft (no greeting) if the call errors.
# voice:
#   enabled: true
#   name: "Your editor's name"          # e.g. a persona you make up
#   tone: "warm, cozy, slightly witty"  # describe personality + writing style

# web: also publish a browsable HTML "web edition" + a dated archive into
# `output_dir` (serve it with GitHub Pages — Settings → Pages → /docs).
# edition_url is the public URL, linked from a "cover" email.
# web:
#   enabled: true
#   output_dir: "docs"
#   edition_url: "https://YOURNAME.github.io/YOURREPO/"

# editions: ship more than once a day. Listed in chronological order; each runs
# when the local hour is before its `until_hour`. The last one is the catch-all.
# Match these to the cron times in .github/workflows/daily.yml.
# editions:
#   - { key: morning, label: "Morning Edition", until_hour: 12 }
#   - { key: evening, label: "Evening Edition" }
