name: Claude PR Review

# Advisory AI review of every PR — posts comments, NEVER blocks merge.
#
# Setup (one-time, optional): run `claude setup-token` locally (needs a Claude
# Pro/Max subscription) and add the result as a repo secret named
# CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and variables → Actions).
# Without the secret the job skips itself.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write   # claude-code-action@v1 mints its GitHub token via OIDC

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Auto-review PRs from THIS repo (not forks); on comments, only when @claude is mentioned.
    if: |
      github.event.repository.full_name == github.repository &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    steps:
      - name: Check for token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "No CLAUDE_CODE_OAUTH_TOKEN secret — skipping review."; fi

      - name: Checkout (full history for diff context)
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        # ADVISORY only — a review that runs out of turns or hits a transient
        # error must NEVER turn the PR check red.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Review this pull request for a Python daily-briefing generator that runs on
            GitHub Actions. Read CLAUDE.md first: its invariants are the review rules.

            Review the PR diff (`git diff --merge-base origin/main`). Look for:
            - Bugs and broken logic; anything that would crash or break the scheduled run
            - Source adapters that don't return list[Item], skip the hardened fetch, or
              have fragile selectors / parsing / encoding
            - LLM calls that can raise into the pipeline instead of failing soft
            - New config keys that aren't off by default
            - Source/feed text rendered into HTML without escaping
            - Secrets or API keys leaked into code or logs

            Post findings as PR review comments grouped BLOCKING / IMPORTANT / MINOR,
            each with path:line, the reason, and a concrete fix. Skip style nitpicks.
            End with a one-line verdict. This is ADVISORY — do not fail the check.
          # Sonnet for cost; cap turns so a single review can't run away.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
